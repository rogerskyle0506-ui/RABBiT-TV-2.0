Name: Build Global Android APK & Publish Nightly

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22 Required for TanStack Start)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Required for Gradle/Android Compilation)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI, Android & Assets Packages
        run: npm install @capacitor/cli@^6 @capacitor/android@^6 @capacitor/assets --save-dev

      - name: Verify Capacitor Config & Icon Exists
        run: |
          if [ ! -f capacitor.config.json ]; then
            echo "Error: capacitor.config.json is missing!"
            exit 1
          fi
          if [ ! -f assets/icon.png ]; then
            echo "Error: assets/icon.png is missing!"
            exit 1
          fi

      - name: Apply Explicit Patches for Android TV App
        run: |
          mkdir -p src/lib src/routes

          # 0. Copy settings store & theme types to src/lib/settings.ts
          if [ -f patches/settings.ts ]; then
            cp patches/settings.ts src/lib/settings.ts
            echo "Successfully patched src/lib/settings.ts"
          else
            echo "Warning: patches/settings.ts not found!"
          fi

          # 1. Copy storage engine to src/lib/watch-history.ts
          if [ -f patches/watch-history.ts ]; then
            cp patches/watch-history.ts src/lib/watch-history.ts
            echo "Successfully patched src/lib/watch-history.ts"
          else
            echo "Warning: patches/watch-history.ts not found!"
          fi

          # 2. Copy watch history route UI to src/routes/watch-history.tsx
          if [ -f patches/watch-history.tsx ]; then
            cp patches/watch-history.tsx src/routes/watch-history.tsx
            echo "Successfully patched src/routes/watch-history.tsx"
          else
            echo "Warning: patches/watch-history.tsx not found!"
          fi

          # 3. Copy details route UI to src/routes/details.tsx
          if [ -f patches/details.tsx ]; then
            cp patches/details.tsx src/routes/details.tsx
            echo "Successfully patched src/routes/details.tsx"
          else
            echo "Error: patches/details.tsx not found!"
            exit 1
          fi

          # 4. Copy main catalog & My List UI to src/routes/index.tsx
          if [ -f patches/index.tsx ]; then
            cp patches/index.tsx src/routes/index.tsx
            echo "Successfully patched src/routes/index.tsx"
          else
            echo "Warning: patches/index.tsx not found!"
          fi

          # 5. Copy root UI (settings & tabs) to src/routes/__root.tsx
          if [ -f patches/__root.tsx ]; then
            cp patches/__root.tsx src/routes/__root.tsx
            echo "Successfully patched src/routes/__root.tsx"
          else
            echo "Error: patches/__root.tsx not found!"
            exit 1
          fi

          # 6. Copy global styles to src/styles.css (with slow-glow animations)
          if [ -f patches/styles.css ]; then
            cp patches/styles.css src/styles.css
            echo "Successfully patched src/styles.css"
          else
            echo "Warning: patches/styles.css not found!"
          fi

      - name: Create Temporary index.html for Capacitor Build
        run: |
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>RABBiT TV</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/entry-client.tsx"></script>
            </body>
          </html>
          EOF

      - name: Generate Dynamic Version File with Nightly Build Identifier
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p src/lib
          cat << EOF > src/lib/version.ts
          export const APP_VERSION = "${VERSION}";
          export const BUILD_TYPE = "nightly";
          export const IS_STABLE = false;
          EOF
          echo "Generated version.ts with version ${VERSION} (nightly)"

      - name: Build Web Assets for Capacitor (Executes Version Bump)
        env:
          CAPACITOR_BUILD: "true"
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          VITE_GH_PAT: ${{ secrets.GH_PAT }}
          VITE_GIST_ID: ${{ secrets.VITE_GIST_ID }}
        run: npm run build

      - name: Extract App Name & Bumped Version for Artifacts
        id: version-extractor
        run: |
          VERSION=$(node -p "require('./package.json').version")

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "artifact_name=rabbittv-v${VERSION}-nightly" >> $GITHUB_OUTPUT
          echo "apk_filename=rabbittv-v${VERSION}-nightly.apk" >> $GITHUB_OUTPUT

          echo "Building RABBiT TV Nightly version ${VERSION}"

      - name: Generate Nightly Manifest JSON
        run: |
          VERSION="${{ steps.version-extractor.outputs.version }}"
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          BUILD=$(echo $VERSION | cut -d. -f4)
          [ -z "$BUILD" ] && BUILD=0
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + BUILD))
          
          APK_FILENAME="${{ steps.version-extractor.outputs.apk_filename }}"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${APK_FILENAME}"

          mkdir -p updates
          cat << EOF > updates/nightly_manifest.json
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION}",
            "apkUrl": "${APK_URL}",
            "releaseNotes": "Automated nightly build v${VERSION} compiled and verified via GitHub Actions."
          }
          EOF
          echo "Generated updates/nightly_manifest.json for version ${VERSION}"

      - name: Map TanStack Shell to Capacitor index.html
        run: |
          if [ -f dist/client/_shell.html ]; then
            cp dist/client/_shell.html dist/client/index.html
            echo "Successfully copied _shell.html to index.html"
          elif [ ! -f dist/client/index.html ]; then
            echo "Error: Could not find _shell.html or index.html in dist/client"
            ls -R dist/ || true
            exit 1
          fi

      - name: Create Dummy www Folder for Capacitor Init
        run: |
          mkdir -p www
          cp dist/client/index.html www/index.html

      - name: Initialize or Sync Capacitor Android Platform Safely
        run: |
          if [ -f android/app/rabbittv.keystore ]; then
            mkdir -p /tmp/keystore_backup
            cp android/app/rabbittv.keystore /tmp/keystore_backup/rabbittv.keystore
            echo "Backed up existing keystore."
          fi

          if [ ! -d android ] || [ ! -f android/app/build.gradle ] || [ ! -f android/gradlew ]; then
            echo "Android platform missing or incomplete, re-creating..."
            rm -rf android
            npx @capacitor/cli add android
          else
            echo "Android platform exists, syncing..."
            npx @capacitor/cli sync android
          fi

          if [ -f /tmp/keystore_backup/rabbittv.keystore ]; then
            mkdir -p android/app
            cp /tmp/keystore_backup/rabbittv.keystore android/app/rabbittv.keystore
            echo "Restored keystore to android/app/"
          fi

          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Sync Package.json Version to Android Build.gradle
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          BUILD=$(echo $VERSION | cut -d. -f4)
          [ -z "$BUILD" ] && BUILD=0
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + BUILD))

          echo "Updating Android build.gradle with Version Name: $VERSION and Version Code: $VERSION_CODE"

          if [ -f android/app/build.gradle ]; then
            sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/g" android/app/build.gradle
            sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/g" android/app/build.gradle
          else
            echo "Error: android/app/build.gradle not found!"
            exit 1
          fi

      - name: Generate App Icons and Splash Screens from Standard Assets
        run: npx @capacitor/assets generate --android

      - name: Install Pillow & Convert HeaderFamily.jpg to True PNG TV Banner
        run: |
          pip install Pillow
          python3 -c "
          import os
          from PIL import Image

          if os.path.exists('assets/HeaderFamily.jpg'):
              img = Image.open('assets/HeaderFamily.jpg').convert('RGBA')
              img.save('assets/tv_banner.png', 'PNG')
              print('Successfully converted HeaderFamily.jpg to true PNG tv_banner.png')
          else:
              print('Error: assets/HeaderFamily.jpg not found!')
              exit(1)
          "

          mkdir -p android/app/src/main/java/com/rabbittv/app
          cp patches/MainActivity.java android/app/src/main/java/com/rabbittv/app/MainActivity.java

          mkdir -p android/app/src/main/res/drawable
          cp assets/tv_banner.png android/app/src/main/res/drawable/tv_banner.png

          cp patches/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
              </style>

              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:windowBackground">#050b16</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/tv_banner</item>
                  <item name="android:windowSplashScreenBackground">#050b16</item>
              </style>
          </resources>
          EOF

      - name: Verify Android Directory Exists
        run: |
          if [ ! -d android ]; then
            echo "Error: android directory was not created!"
            exit 1
          fi

      - name: Build Signed Release APK with Custom Keystore
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/rabbittv.keystore \
            -Pandroid.injected.signing.store.password=RABBITV34688643 \
            -Pandroid.injected.signing.key.alias=RABBITV34688643 \
            -Pandroid.injected.signing.key.password=RABBITV34688643

      - name: Save APK Artifact Locally for Workflow Run
        run: |
          mkdir -p updates
          cp android/app/build/outputs/apk/release/app-release.apk updates/${{ steps.version-extractor.outputs.apk_filename }}
          echo "Successfully saved APK as updates/${{ steps.version-extractor.outputs.apk_filename }}"

      - name: Commit Version Bump & Manifest (Excluding APK Binary)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          # Only commit config changes, version bumps, and the nightly manifest—never commit the raw APK binary
          git add package.json capacitor.config.json android/app/build.gradle src/lib/version.ts updates/nightly_manifest.json
          git commit -m "chore: auto-bump version and update nightly manifest to v${{ steps.version-extractor.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version-extractor.outputs.artifact_name }}
          path: updates/${{ steps.version-extractor.outputs.apk_filename }}
